# Keeps the Supabase project from pausing.
#
# A free project is paused after about a week with no database activity, and a
# paused project has no address at all: every signed-in reader's sync fails
# until someone presses Restore in the dashboard. Gunit itself carries on —
# the library is local — but nothing reaches the account.
#
# So this asks the database one small question twice a week, which is activity
# by any measure: a read through the REST API, with the public anon key the
# app already ships to every browser. Row level security answers it with an
# empty list, and the query still runs.
#
# It also says when it is too late. A paused project fails the request, the
# run goes red, and GitHub emails the repository owner — a better way to find
# out than a reader saying sync stopped.
#
# Needs, in the repository's Actions settings:
#   variable  SUPABASE_URL        https://<ref>.supabase.co
#   secret    SUPABASE_ANON_KEY   the project's anon (public) key
# Without them the run is skipped rather than failed.
#
# GitHub stops scheduled runs in a public repository after 60 days without a
# commit. If that happens it says so in the Actions tab, with a button to turn
# this back on.

name: Keep Supabase awake

on:
  schedule:
    # Mondays and Thursdays: never more than four days apart, well inside the
    # week a project is allowed to sit idle. Off the hour, when runs queue.
    - cron: '17 6 * * 1,4'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.SUPABASE_URL != '' }}
    steps:
      - name: Ask the database one small question
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 30 \
            --header "apikey: $SUPABASE_ANON_KEY" \
            --header "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/decks?select=id&limit=1" || true)
          echo "Supabase answered $status"
          if [ "$status" != 200 ]; then
            echo "::error::Supabase did not answer (status $status). If the project is paused, restore it from the dashboard."
            exit 1
          fi
